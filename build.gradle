plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.familysupport'
version = '0.0.1-SNAPSHOT'
description = 'family-support'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	compileOnly 'org.projectlombok:lombok'
	// DB — 로컬 MySQL 8.4(스키마 family, 계정 family). 테이블은 db/schema.sql을 사람이 적용하고 앱은 검증만 한다.
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

// 정적 파일 캐시 무효화 — index.html의 css·js 링크 ?v=@assetVersion@ 를 빌드 시각으로 바꾼다.
// Cloudflare가 /css·/js를 4시간 캐시하므로, 배포할 때마다 주소가 달라져야 새 파일이 바로 보인다(2026-11-24).
def assetVersion = new Date().format('yyyyMMddHHmm', TimeZone.getTimeZone('Asia/Seoul'))
tasks.named('processResources') {
	inputs.property('assetVersion', assetVersion)
	filteringCharset = 'UTF-8'
	filesMatching('static/index.html') {
		filter(org.apache.tools.ant.filters.ReplaceTokens, tokens: [assetVersion: assetVersion])
	}
}

tasks.named('test') {
	useJUnitPlatform()
	systemProperty 'spring.profiles.active', 'test'
}
