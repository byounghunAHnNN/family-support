spring.application.name=family-support
# 정산앱(8080)과 같은 PC에서 함께 띄울 수 있게 포트를 나눈다
server.port=8090
# Windows 콘솔 기본(CP949) 대신 UTF-8로 로그를 쓴다(로그 파일로 돌렸을 때 한글이 깨지지 않게)
logging.charset.console=UTF-8

# 로컬 비밀값(공공데이터포털 인증키) — 프로젝트 루트 secret.properties, git 제외. PC마다 따로 둔다.
spring.config.import=optional:file:./secret.properties

# DB — 로컬 MySQL. 비밀번호는 secret.properties의 FAMILY_DB_PASSWORD(git 제외)
spring.datasource.url=jdbc:mysql://localhost:3306/family?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=family
spring.datasource.password=${FAMILY_DB_PASSWORD}
# 테이블은 앱이 만들지 않는다(db/schema.sql을 DBeaver로 적용). 앱은 엔티티와 맞는지 검증만 한다.
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# 요청 JSON — 정수 칸(나이·소득)에 소수가 오면 400으로 거절한다
spring.jackson.deserialization.accept-float-as-int=false

# ── 수집 ─────────────────────────────────────────────────────
family.api.service-key=${DATA_GO_KR_KEY:}
# 매일 새벽 5시(한국 시간) 전체 수집. "-"로 두면 끈다.
family.collect.cron=0 0 5 * * *
# 서버 시작 시 저장된 사업이 하나도 없으면 바로 수집을 시작한다(백그라운드)
family.collect.on-startup=true
# 수동 수집 API(POST /api/collect) — 운영에서는 끈다. local 프로필에서만 켠다.
family.collect.manual-enabled=false
